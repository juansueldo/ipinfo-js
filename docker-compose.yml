version: "3.8"
services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - RATE_WINDOW_MS=60000
      - RATE_MAX=120
    depends_on:
      - redis
    volumes:
      - ./GeoLite2-City.mmdb:/app/GeoLite2-City.mmdb:ro
  redis:
    image: redis:7-alpine
    restart: unless-stopped
